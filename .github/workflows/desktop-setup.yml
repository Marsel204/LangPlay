name: Desktop setup packages
on:
  workflow_dispatch:
  push:
    paths:
      - 'installer/**'
      - 'integrations/seanime/**'
      - 'Server.py'
      - 'japanese_parser.py'
      - 'requirements-parser.txt'
      - '.github/workflows/desktop-setup.yml'
  pull_request:
    paths:
      - 'installer/**'
      - 'integrations/seanime/**'
      - '.github/workflows/desktop-setup.yml'
permissions:
  contents: read
concurrency:
  group: desktop-setup-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            installer/requirements-build.txt
            requirements-parser.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/seanime/package-lock.json
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk libgtk-3-0 libnss3 libasound2 libgbm1 libxkbcommon0 xvfb
      - run: python -m pip install -r installer/requirements-build.txt -r requirements-parser.txt
      - run: npm --prefix integrations/seanime ci
      - run: npm --prefix integrations/seanime test
      - run: npm --prefix integrations/seanime run build
      - run: python -m unittest discover -s installer/tests -p "test_*.py"
      - name: Existing Linux companion and browser native-host regressions
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Existing Windows parser regressions
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_japanese_parser.py"
      - run: python installer/build.py
      - name: Packaged runtime smoke
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python installer/tests/packaged_smoke.py installer/dist/LangPlay-Setup-Windows-x64.exe
          else
            python installer/tests/packaged_smoke.py installer/dist/LangPlay-Setup-Linux-x86_64
          fi
      - name: Linux real-package install and rerun
        if: runner.os == 'Linux'
        run: xvfb-run -a python installer/tests/live_install.py --cache installer/.build/downloads
      - name: Windows real-package install and rerun
        if: runner.os == 'Windows'
        run: python installer/tests/live_install.py --cache installer/.build/downloads
      - name: Linux frozen installer and installed runtime
        if: runner.os == 'Linux'
        run: xvfb-run -a python installer/tests/packaged_install.py installer/dist/LangPlay-Setup-Linux-x86_64 --cache installer/.build/downloads
      - name: Windows frozen installer and installed runtime
        if: runner.os == 'Windows'
        run: python installer/tests/packaged_install.py installer/dist/LangPlay-Setup-Windows-x64.exe --cache installer/.build/downloads
      - name: Add source and notices
        shell: bash
        run: |
          git archive --format=zip HEAD -o installer/dist/LangPlay-source.zip
          cp installer/README.md installer/THIRD_PARTY.md installer/dist/
          python -c "import hashlib,pathlib; p=pathlib.Path('installer/dist'); (p/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in sorted(p.iterdir()) if f.is_file() and f.name!='SHA256SUMS'))"
      - uses: actions/upload-artifact@v4
        with:
          name: LangPlay-Setup-${{ runner.os }}-x64
          path: installer/dist/
          retention-days: 30
