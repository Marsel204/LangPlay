<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LangPlay</title></head>
<body>
<main>
  <header><strong>LangPlay</strong><span id="clock"></span><button id="settings" aria-expanded="false">Subtitles</button><button id="hide">Hide</button></header>
  <section id="setup" hidden aria-label="Subtitle settings">
    <p>Choose the same Japanese file used in Subtitle Engine. Learning works in Seanime’s windowed browser player.</p>
    <label class="file">Japanese subtitle <input id="file" type="file" accept=".srt,.vtt,.ass,.ssa"></label>
    <details><summary>Paste subtitle text instead</summary><label>File name <input id="paste-name" value="Japanese.srt" maxlength="256"></label><label>Subtitle text <textarea id="paste-text" rows="4" maxlength="10485760" placeholder="Paste the full SRT, VTT, ASS or SSA file"></textarea></label><button id="import-paste">Import text</button></details>
    <div class="settings-row"><label>Encoding <select id="encoding"><option value="auto">UTF-8 / BOM</option><option value="shift_jis">Shift_JIS</option></select></label>
    <label>Delay (ms) <input id="offset" type="number" step="100" min="-3600000" max="3600000" value="0"></label>
    <label>Reading <select id="mode"><option value="plain">Japanese</option><option value="furigana">Furigana</option><option value="romaji">Romaji</option></select></label></div>
    <p id="source" class="muted"></p><button id="export">Export cards (TSV)</button><a id="download" hidden download="langplay-cards.tsv">Download cards</a>
  </section>
  <div id="caption" lang="ja" aria-label="Learning subtitles"><p class="muted">Connecting to Seanime…</p></div>
  <button id="continue" hidden>Resume watching</button>
  <section id="drawer" hidden aria-label="Selected word">
    <div class="drawer-top"><div><h1 id="word" lang="ja"></h1><p id="reading" lang="ja"></p></div><button id="close">Close</button></div>
    <p id="base" class="muted"></p><p id="meaning"></p><blockquote id="sentence" lang="ja"></blockquote><p id="context" class="muted"></p>
    <div class="actions"><button id="save">Save card</button><button id="explain">Explain this sentence</button></div>
    <div id="explanation" class="answer" hidden></div>
    <form id="chat"><label for="question">Ask about this sentence</label><div class="question"><input id="question" maxlength="2000" placeholder="Why is this form used?"><button type="submit">Ask</button></div></form>
    <div id="reply" class="answer" hidden></div><button id="resume" class="primary">Resume watching</button>
    <p class="muted">Close or Escape keeps playback paused.</p>
  </section>
  <p id="notice" role="status" aria-live="polite"></p>
</main>
<!-- LANGPLAY_ASSETS -->
</body></html>
